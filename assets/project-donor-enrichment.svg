<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="t d">
  <title id="t">Donor Enrichment Platform: AI-powered enrichment of donor records, at scale.</title>
  <desc id="d">AI-Powered Donor Enrichment Platform, built as AI Engineer with FastAPI, PostgreSQL, Next.js, Redis and a Manifest V3 Chrome extension. 80% enrichment success via RocketReach, TruthFinder and FEC APIs; 200+ tasks a day; saves 30+ hours a week; 90% less manual intervention.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/></linearGradient>
    <radialGradient id="glow" cx="78%" cy="40%" r="55%"><stop offset="0" stop-color="#701A3D" stop-opacity="0.6"/><stop offset="1" stop-color="#451126" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="370" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="370" rx="20" fill="url(#glow)"/>
  <rect x=".5" y=".5" width="1199" height="369" rx="19.5" fill="none" stroke="#C77B9B" stroke-opacity=".16"/>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#F8F0F3" stroke-opacity=".03"/></pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .in { animation: in 1s cubic-bezier(.16,1,.3,1) both; }
    .fade { animation: fade 1.2s ease both; }
    .draw { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: draw 1.8s cubic-bezier(.65,0,.35,1) .4s forwards; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes blink { 50% { opacity: 0; } }
    .d1{animation-delay:.15s}.d2{animation-delay:.3s}.d3{animation-delay:.45s}.d4{animation-delay:.6s}
    @media (prefers-reduced-motion: reduce) {
      .in, .fade, .blink { animation: none; }
      .draw { animation: none; stroke-dashoffset: 0; }
      .motion { display: none; }
    }
  </style>
  <rect x="720" y="0" width="480" height="370" fill="url(#grid)"/>
  <g class="in"><text class="mono" x="56" y="58" font-size="11" letter-spacing="3" fill="#C77B9B">01 · AI ENGINEER · FASTAPI · NEXT.JS</text></g>
  <g class="in d1"><text class="serif" x="54" y="118" font-size="46" letter-spacing="-.5" fill="#F8F0F3">Donor Enrichment Platform</text></g>
  <g class="in d2">
    <text class="sans" x="56" y="158" font-size="17" fill="#B6A3AC">AI-powered enrichment of donor records, at scale.</text>
    <text class="mono" x="56" y="192" font-size="12.5" fill="#C77B9B">BUILT › <tspan fill="#F8F0F3">Chrome Extension (MV3) + enrichment via RocketReach, TruthFinder, FEC</tspan></text>
  </g>
  <path class="draw" d="M56 220 H690" stroke="#C77B9B" stroke-opacity=".3"/>
  <g class="in d3">
      <text class="serif" x="56" y="270" font-size="36" fill="#F8F0F3">80%</text>
      <text class="sans" x="57" y="293" font-size="13" fill="#B6A3AC">enrichment success rate</text>
      <text class="serif" x="261" y="270" font-size="36" fill="#F8F0F3">200+</text>
      <text class="sans" x="262" y="293" font-size="13" fill="#B6A3AC">tasks processed per day</text>
      <text class="serif" x="466" y="270" font-size="36" fill="#F8F0F3">30+ hrs</text>
      <text class="sans" x="467" y="293" font-size="13" fill="#B6A3AC">saved every week</text>
  </g>
  <g class="in d4">
      <rect x="56" y="310" width="78" height="28" rx="14" fill="#451126" fill-opacity=".5" stroke="#C77B9B" stroke-opacity=".3"/>
      <text class="mono" x="95" y="328" font-size="11.5" text-anchor="middle" fill="#E5B5C7">FastAPI</text>
      <rect x="142" y="310" width="99" height="28" rx="14" fill="#451126" fill-opacity=".5" stroke="#C77B9B" stroke-opacity=".3"/>
      <text class="mono" x="191.5" y="328" font-size="11.5" text-anchor="middle" fill="#E5B5C7">PostgreSQL</text>
      <rect x="249" y="310" width="78" height="28" rx="14" fill="#451126" fill-opacity=".5" stroke="#C77B9B" stroke-opacity=".3"/>
      <text class="mono" x="288" y="328" font-size="11.5" text-anchor="middle" fill="#E5B5C7">Next.js</text>
      <rect x="335" y="310" width="64" height="28" rx="14" fill="#451126" fill-opacity=".5" stroke="#C77B9B" stroke-opacity=".3"/>
      <text class="mono" x="367" y="328" font-size="11.5" text-anchor="middle" fill="#E5B5C7">Redis</text>
      <rect x="407" y="310" width="99" height="28" rx="14" fill="#451126" fill-opacity=".5" stroke="#C77B9B" stroke-opacity=".3"/>
      <text class="mono" x="456.5" y="328" font-size="11.5" text-anchor="middle" fill="#E5B5C7">Chrome MV3</text>
      <rect x="514" y="310" width="170" height="28" rx="14" fill="#701A3D" fill-opacity=".55" stroke="#C77B9B" stroke-opacity=".6"/>
      <text class="mono" x="599" y="328" font-size="11.5" text-anchor="middle" fill="#F8F0F3">90% less manual work</text>
  </g>
  <g class="fade d2">
  <rect x="780" y="92" width="124" height="34" rx="17" fill="#10070C" fill-opacity=".85" stroke="#C77B9B" stroke-opacity=".4"/>
    <text class="mono" x="842" y="113" font-size="11.5" text-anchor="middle" fill="#E5B5C7">RocketReach</text>
    <rect x="780" y="158" width="124" height="34" rx="17" fill="#10070C" fill-opacity=".85" stroke="#C77B9B" stroke-opacity=".4"/>
    <text class="mono" x="842" y="179" font-size="11.5" text-anchor="middle" fill="#E5B5C7">TruthFinder</text>
    <rect x="780" y="224" width="124" height="34" rx="17" fill="#10070C" fill-opacity=".85" stroke="#C77B9B" stroke-opacity=".4"/>
    <text class="mono" x="842" y="245" font-size="11.5" text-anchor="middle" fill="#E5B5C7">FEC API</text>
    <path d="M904 109 C940 109 930 175 968 175" fill="none" stroke="#C77B9B" stroke-opacity=".45" stroke-dasharray="3 5"/>
    <circle class="motion" r="3.2" fill="#F8F0F3" filter="url(#soft)"><animateMotion dur="2.4s" begin="0s" repeatCount="indefinite" path="M904 109 C940 109 930 175 968 175"/></circle>
    <path d="M904 175 C940 175 930 175 968 175" fill="none" stroke="#C77B9B" stroke-opacity=".45" stroke-dasharray="3 5"/>
    <circle class="motion" r="3.2" fill="#F8F0F3" filter="url(#soft)"><animateMotion dur="2.4s" begin="0.6s" repeatCount="indefinite" path="M904 175 C940 175 930 175 968 175"/></circle>
    <path d="M904 241 C940 241 930 175 968 175" fill="none" stroke="#C77B9B" stroke-opacity=".45" stroke-dasharray="3 5"/>
    <circle class="motion" r="3.2" fill="#F8F0F3" filter="url(#soft)"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite" path="M904 241 C940 241 930 175 968 175"/></circle>
    <circle cx="992" cy="175" r="26" fill="#701A3D" stroke="#E5B5C7" stroke-opacity=".8"/>
    <text class="mono" x="992" y="179" font-size="10" text-anchor="middle" fill="#F8F0F3" letter-spacing="1">AI</text>
    <path d="M1018 175 H1040" fill="none" stroke="#C77B9B" stroke-opacity=".45" stroke-dasharray="3 5"/>
    <circle class="motion" r="3.2" fill="#F8F0F3" filter="url(#soft)"><animateMotion dur="1.2s" begin="0s" repeatCount="indefinite" path="M1018 175 H1040"/></circle>
    <rect x="1040" y="84" width="122" height="182" rx="12" fill="#10070C" fill-opacity=".9" stroke="#C77B9B" stroke-opacity=".45"/>
    <circle cx="1101" cy="122" r="18" fill="#451126" stroke="#C77B9B" stroke-opacity=".6"/>
    <circle cx="1101" cy="117" r="6" fill="#C77B9B"/><path d="M1090 132 a11 9 0 0 1 22 0" fill="#C77B9B"/>
    <rect x="1056" y="152" width="90" height="6" rx="3" fill="#E5B5C7" opacity=".8"/>
    <rect x="1056" y="166" width="70" height="5" rx="2.5" fill="#B6A3AC" opacity=".35"/>
    <rect x="1056" y="178" width="80" height="5" rx="2.5" fill="#B6A3AC" opacity=".35"/>
    <rect x="1056" y="190" width="58" height="5" rx="2.5" fill="#B6A3AC" opacity=".35"/>
    <rect x="1056" y="226" width="90" height="24" rx="12" fill="#701A3D" fill-opacity=".7"/>
    <text class="mono" x="1101" y="242" font-size="10.5" text-anchor="middle" fill="#F8F0F3">✓ enriched</text>
    <text class="mono" x="780" y="300" font-size="10" letter-spacing="2" fill="#B6A3AC">CHROME EXTENSION (MV3) · FASTAPI · REDIS</text>
  </g>
</svg>
