<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="t d">
  <title id="t">AI Image Segmentation: Splits an image into layers you can edit and recolour.</title>
  <desc id="d">AI Image Segmentation and Layer Editing System in Python: computer vision and masking separate background, foreground and text into layers that can be recoloured dynamically.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/></linearGradient>
    <radialGradient id="glow" cx="78%" cy="40%" r="55%"><stop offset="0" stop-color="#701A3D" stop-opacity="0.6"/><stop offset="1" stop-color="#451126" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="370" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="370" rx="20" fill="url(#glow)"/>
  <rect x=".5" y=".5" width="1199" height="369" rx="19.5" fill="none" stroke="#C77B9B" stroke-opacity=".16"/>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#F8F0F3" stroke-opacity=".03"/></pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .in { animation: in 1s cubic-bezier(.16,1,.3,1) both; }
    .fade { animation: fade 1.2s ease both; }
    .draw { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: draw 1.8s cubic-bezier(.65,0,.35,1) .4s forwards; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes blink { 50% { opacity: 0; } }
    .d1{animation-delay:.15s}.d2{animation-delay:.3s}.d3{animation-delay:.45s}.d4{animation-delay:.6s}
    @media (prefers-reduced-motion: reduce) {
      .in, .fade, .blink { animation: none; }
      .draw { animation: none; stroke-dashoffset: 0; }
      .motion { display: none; }
    }
  </style>
  <rect x="720" y="0" width="480" height="370" fill="url(#grid)"/>
  <g class="in"><text class="mono" x="56" y="58" font-size="11" letter-spacing="3" fill="#C77B9B">02 · COMPUTER VISION · PYTHON</text></g>
  <g class="in d1"><text class="serif" x="54" y="118" font-size="46" letter-spacing="-.5" fill="#F8F0F3">AI Image Segmentation</text></g>
  <g class="in d2">
    <text class="sans" x="56" y="158" font-size="17" fill="#B6A3AC">Splits an image into layers you can edit and recolour.</text>
    <text class="mono" x="56" y="192" font-size="12.5" fill="#C77B9B">BUILT › <tspan fill="#F8F0F3">masking pipeline separating background / foreground / text</tspan></text>
  </g>
  <path class="draw" d="M56 220 H690" stroke="#C77B9B" stroke-opacity=".3"/>
  <g class="in d3">
      <text class="serif" x="56" y="270" font-size="36" fill="#F8F0F3">3 layers</text>
      <text class="sans" x="57" y="293" font-size="13" fill="#B6A3AC">background · foreground · text</text>
      <text class="serif" x="261" y="270" font-size="36" fill="#F8F0F3">Recolour</text>
      <text class="sans" x="262" y="293" font-size="13" fill="#B6A3AC">each layer, dynamically</text>
      <text class="serif" x="466" y="270" font-size="36" fill="#F8F0F3">Masking</text>
      <text class="sans" x="467" y="293" font-size="13" fill="#B6A3AC">precise per-layer edits</text>
  </g>
  <g class="in d4">
      <rect x="56" y="310" width="71" height="28" rx="14" fill="#451126" fill-opacity=".5" stroke="#C77B9B" stroke-opacity=".3"/>
      <text class="mono" x="91.5" y="328" font-size="11.5" text-anchor="middle" fill="#E5B5C7">Python</text>
      <rect x="135" y="310" width="135" height="28" rx="14" fill="#451126" fill-opacity=".5" stroke="#C77B9B" stroke-opacity=".3"/>
      <text class="mono" x="202.5" y="328" font-size="11.5" text-anchor="middle" fill="#E5B5C7">Computer Vision</text>
      <rect x="278" y="310" width="78" height="28" rx="14" fill="#451126" fill-opacity=".5" stroke="#C77B9B" stroke-opacity=".3"/>
      <text class="mono" x="317" y="328" font-size="11.5" text-anchor="middle" fill="#E5B5C7">Masking</text>
      <rect x="364" y="310" width="120" height="28" rx="14" fill="#701A3D" fill-opacity=".55" stroke="#C77B9B" stroke-opacity=".6"/>
      <text class="mono" x="424" y="328" font-size="11.5" text-anchor="middle" fill="#F8F0F3">Layer editing</text>
  </g>
  <g class="fade d2">
  <g class="in" style="animation-delay:0.5s" transform="translate(770 196)">
      <path d="M0 40 L170 0 L300 40 L130 80 Z" fill="#451126" fill-opacity=".85" stroke="#E5B5C7" stroke-opacity=".5"/>
      <path d="M40 40 L170 10 L260 40 L130 70 Z" fill="#701A3D" opacity=".6">
        <animate class="motion" attributeName="fill" values="#701A3D;#A12556;#C77B9B;#701A3D" dur="6s" repeatCount="indefinite"/></path>
      <text class="mono" x="312" y="44" font-size="10.5" letter-spacing="1.6" fill="#B6A3AC">BACKGROUND</text>
    </g>
    <g class="in" style="animation-delay:0.7s" transform="translate(770 128)">
      <path d="M0 40 L170 0 L300 40 L130 80 Z" fill="#10070C" fill-opacity=".85" stroke="#E5B5C7" stroke-opacity=".5"/>
      <ellipse cx="150" cy="40" rx="52" ry="20" fill="#C77B9B" opacity=".85">
        <animate class="motion" attributeName="fill" values="#C77B9B;#E5B5C7;#A12556;#C77B9B" dur="6s" begin="2s" repeatCount="indefinite"/></ellipse>
      <text class="mono" x="312" y="44" font-size="10.5" letter-spacing="1.6" fill="#B6A3AC">FOREGROUND</text>
    </g>
    <g class="in" style="animation-delay:0.9s" transform="translate(770 60)">
      <path d="M0 40 L170 0 L300 40 L130 80 Z" fill="#10070C" fill-opacity=".85" stroke="#E5B5C7" stroke-opacity=".5"/>
      <text class="serif" x="150" y="48" font-size="26" font-style="italic" text-anchor="middle" fill="#F8F0F3" transform="skewX(-10)" dx="8">Aa</text>
      <text class="mono" x="312" y="44" font-size="10.5" letter-spacing="1.6" fill="#B6A3AC">TEXT</text>
    </g>
    <path d="M770 80 V276 M1070 100 V296" stroke="#C77B9B" stroke-opacity=".25" stroke-dasharray="2 5"/>
    <g transform="translate(780 318)"><rect x="0" y="0" width="18" height="18" rx="5" fill="#701A3D"/><rect x="26" y="0" width="18" height="18" rx="5" fill="#A12556"/><rect x="52" y="0" width="18" height="18" rx="5" fill="#C77B9B"/><rect x="78" y="0" width="18" height="18" rx="5" fill="#E5B5C7"/><rect x="104" y="0" width="18" height="18" rx="5" fill="#F8F0F3"/>
      <text class="mono" x="140" y="13" font-size="10" letter-spacing="2" fill="#B6A3AC">RECOLOUR ANY LAYER</text></g>
  </g>
</svg>
