<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-labelledby="t d">
  <title id="t">Tech stack</title>
  <desc id="d">AI: LLMs, agentic AI, AI agents, OpenAI API. Backend: Python (primary) with Django, FastAPI and Celery; PHP with Laravel and CodeIgniter. Frontend: React, Next.js, JavaScript, Chrome extensions (MV3). Data and search: PostgreSQL, MySQL, MongoDB, Redis, ElasticSearch. Cloud and DevOps: AWS EC2, GitHub Actions, CI/CD. Automation and APIs: N8N, Stripe, OpenAI, RocketReach, FEC, Yardi.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%"><stop offset="0" stop-color="#701A3D" stop-opacity="0.5"/><stop offset="1" stop-color="#451126" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="500" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="500" rx="20" fill="url(#glow)"/>
  <rect x=".5" y=".5" width="1199" height="499" rx="19.5" fill="none" stroke="#C77B9B" stroke-opacity=".16"/>
  <style>
    .serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .in { animation: in 1s cubic-bezier(.16,1,.3,1) both; }
    .fade { animation: fade 1.2s ease both; }
    .draw { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: draw 1.8s cubic-bezier(.65,0,.35,1) .4s forwards; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes blink { 50% { opacity: 0; } }
    
    @media (prefers-reduced-motion: reduce) {
      .in, .fade, .blink { animation: none; }
      .draw { animation: none; stroke-dashoffset: 0; }
      .motion { display: none; }
    }
  </style>
  <g stroke="#C77B9B" stroke-opacity=".14"><path d="M16 250 H1184"/><path d="M406 24 V476 M794 24 V476"/></g>
  <g transform="translate(406 250) rotate(45)"><rect x="-6" y="-6" width="12" height="12" fill="#190B12" stroke="#F8F0F3" stroke-opacity=".8"/></g><g transform="translate(794 250) rotate(45)"><rect x="-6" y="-6" width="12" height="12" fill="#190B12" stroke="#F8F0F3" stroke-opacity=".8"/></g>
    <g class="in" style="animation-delay:0.20s">
      <rect x="32" y="32" width="360" height="200" rx="16" fill="#10070C" fill-opacity=".72" stroke="#C77B9B" stroke-opacity=".2"/>
      <text class="mono" x="56" y="68" font-size="10" letter-spacing="2" fill="#C77B9B">01 AI · LLM · AGENTS</text>
      <text class="serif" x="55" y="124" font-size="32" fill="#F8F0F3">LLMs · Agentic AI</text>
      <text class="serif" x="56" y="164" font-size="22" fill="#F8F0F3">AI Agents</text>
      <text class="serif" x="56" y="198" font-size="20" fill="#B6A3AC">OpenAI API</text>
    </g>
    <g class="in" style="animation-delay:0.32s">
      <rect x="420" y="32" width="360" height="200" rx="16" fill="#10070C" fill-opacity=".72" stroke="#C77B9B" stroke-opacity=".2"/>
      <text class="mono" x="444" y="68" font-size="10" letter-spacing="2" fill="#C77B9B">02 BACKEND</text>
      <text class="serif" x="443" y="124" font-size="32" fill="#F8F0F3">Python<tspan class="mono" dx="12" dy="-14" font-size="10" letter-spacing="1.5" fill="#C77B9B">PRIMARY</tspan></text>
      <text class="serif" x="444" y="164" font-size="22" fill="#F8F0F3">Django · FastAPI · Celery</text>
      <text class="serif" x="444" y="198" font-size="20" fill="#B6A3AC">PHP · Laravel · CodeIgniter</text>
    </g>
    <g class="in" style="animation-delay:0.44s">
      <rect x="808" y="32" width="360" height="200" rx="16" fill="#10070C" fill-opacity=".72" stroke="#C77B9B" stroke-opacity=".2"/>
      <text class="mono" x="832" y="68" font-size="10" letter-spacing="2" fill="#C77B9B">03 FRONTEND</text>
      <text class="serif" x="831" y="124" font-size="32" fill="#F8F0F3">React · Next.js</text>
      <text class="serif" x="832" y="164" font-size="22" fill="#F8F0F3">JavaScript</text>
      <text class="serif" x="832" y="198" font-size="20" fill="#B6A3AC">Chrome Extensions (MV3)</text>
    </g>
    <g class="in" style="animation-delay:0.56s">
      <rect x="32" y="268" width="360" height="200" rx="16" fill="#10070C" fill-opacity=".72" stroke="#C77B9B" stroke-opacity=".2"/>
      <text class="mono" x="56" y="304" font-size="10" letter-spacing="2" fill="#C77B9B">04 DATA &amp; SEARCH</text>
      <text class="serif" x="55" y="360" font-size="32" fill="#F8F0F3">PostgreSQL · MySQL</text>
      <text class="serif" x="56" y="400" font-size="22" fill="#F8F0F3">MongoDB · Redis</text>
      <text class="serif" x="56" y="434" font-size="20" fill="#B6A3AC">ElasticSearch</text>
    </g>
    <g class="in" style="animation-delay:0.68s">
      <rect x="420" y="268" width="360" height="200" rx="16" fill="#10070C" fill-opacity=".72" stroke="#C77B9B" stroke-opacity=".2"/>
      <text class="mono" x="444" y="304" font-size="10" letter-spacing="2" fill="#C77B9B">05 CLOUD &amp; DEVOPS</text>
      <text class="serif" x="443" y="360" font-size="32" fill="#F8F0F3">AWS · EC2</text>
      <text class="serif" x="444" y="400" font-size="22" fill="#F8F0F3">GitHub Actions · CI/CD</text>
      <text class="serif" x="444" y="434" font-size="20" fill="#B6A3AC">DevOps</text>
    </g>
    <g class="in" style="animation-delay:0.80s">
      <rect x="808" y="268" width="360" height="200" rx="16" fill="#10070C" fill-opacity=".72" stroke="#C77B9B" stroke-opacity=".2"/>
      <text class="mono" x="832" y="304" font-size="10" letter-spacing="2" fill="#C77B9B">06 AUTOMATION &amp; APIS</text>
      <text class="serif" x="831" y="360" font-size="32" fill="#F8F0F3">N8N Workflows</text>
      <text class="serif" x="832" y="400" font-size="22" fill="#F8F0F3">Stripe · OpenAI</text>
      <text class="serif" x="832" y="434" font-size="20" fill="#B6A3AC">RocketReach · FEC · Yardi</text>
    </g>
</svg>
