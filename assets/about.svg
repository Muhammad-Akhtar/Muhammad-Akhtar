      <rect x="836" y="168" width="324" height="88" rx="12" fill="#10070C" fill-opacity=".75" stroke="#C77B9B" stroke-opacity=".2"/>
      <rect x="836" y="172" width="3" height="80" rx="1.5" fill="#C77B9B"/>
      <text class="mono" x="858" y="192" font-size="9.5" letter-spacing="2.2" fill="#C77B9B">WHERE AI LIVES</text>
      <text class="serif" x="857" y="226" font-size="29" fill="#F8F0F3">LLMs &amp; Agents</text>
      <text class="sans" x="858" y="245" font-size="12" fill="#B6A3AC">OpenAI · agentic AI · workflow automation</text>
