      <rect x="836" y="270" width="324" height="88" rx="12" fill="#10070C" fill-opacity=".75" stroke="#C77B9B" stroke-opacity=".2"/>
      <rect x="836" y="274" width="3" height="80" rx="1.5" fill="#C77B9B"/>
      <text class="mono" x="858" y="294" font-size="9.5" letter-spacing="2.2" fill="#C77B9B">ALSO SHIPS IN</text>
      <text class="serif" x="857" y="328" font-size="29" fill="#F8F0F3">PHP · Laravel</text>
      <text class="sans" x="858" y="347" font-size="12" fill="#B6A3AC">CodeIgniter · React · Next.js</text>
