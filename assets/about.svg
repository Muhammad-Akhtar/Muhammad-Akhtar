<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d">
  <title id="t">About Muhammad Akhtar</title>
  <desc id="d">Senior Software Engineer and AI Engineer with 6+ years across Vaival Technologies, Bitsoft and Graymatrix. Grew from backend developer to full stack, senior, lead and AI software engineer. Primary stack Python with Django, FastAPI and Celery; AI work with LLMs, OpenAI, agentic AI and AI agents; also PHP, Laravel, CodeIgniter, React and Next.js.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/></linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="70%"><stop offset="0" stop-color="#701A3D" stop-opacity="0.55"/><stop offset="1" stop-color="#451126" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="420" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="20" fill="url(#glow)"/>
  <rect x=".5" y=".5" width="1199" height="419" rx="19.5" fill="none" stroke="#C77B9B" stroke-opacity=".16"/>
  <defs><pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#F8F0F3" opacity=".025"/></pattern></defs>
  <style>
    .serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .in { animation: in 1s cubic-bezier(.16,1,.3,1) both; }
    .fade { animation: fade 1.2s ease both; }
    .draw { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: draw 1.8s cubic-bezier(.65,0,.35,1) .4s forwards; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes blink { 50% { opacity: 0; } }
    
    @media (prefers-reduced-motion: reduce) {
      .in, .fade, .blink { animation: none; }
      .draw { animation: none; stroke-dashoffset: 0; }
      .motion { display: none; }
    }
  </style>
  <g class="fade">
    <rect x="40" y="40" width="760" height="340" rx="14" fill="#10070C" fill-opacity=".72" stroke="#C77B9B" stroke-opacity=".2"/>
    <rect x="40" y="40" width="760" height="340" rx="14" fill="url(#scan)"/>
    <path d="M40 76 H800" stroke="#C77B9B" stroke-opacity=".15"/>
    <circle cx="62" cy="58" r="5" fill="#701A3D"/><circle cx="80" cy="58" r="5" fill="#451126"/><circle cx="98" cy="58" r="5" fill="#451126"/>
    <text class="mono" x="420" y="62" font-size="12" fill="#B6A3AC" text-anchor="middle">akhtar@portfolio: ~</text>
  </g>
    <g class="in" style="animation-delay:0.40s">
      <text class="mono" x="72" y="122" font-size="14" fill="#C77B9B">$ <tspan fill="#F8F0F3">whoami</tspan></text>
      <text class="mono" x="72" y="147" font-size="13.5" fill="#701A3D">→ <tspan fill="#B6A3AC">Muhammad Akhtar · Senior Software Engineer · AI Engineer</tspan></text>
    </g>
    <g class="in" style="animation-delay:0.75s">
      <text class="mono" x="72" y="172" font-size="14" fill="#C77B9B">$ <tspan fill="#F8F0F3">cat experience.txt</tspan></text>
      <text class="mono" x="72" y="197" font-size="13.5" fill="#701A3D">→ <tspan fill="#B6A3AC">6+ years · Vaival Technologies · Bitsoft · Graymatrix</tspan></text>
    </g>
    <g class="in" style="animation-delay:1.10s">
