      <text class="mono" x="72" y="247" font-size="13.5" fill="#701A3D">→ <tspan fill="#B6A3AC">backend → full stack → senior → lead → AI software engineer</tspan></text>
    </g>
    <g class="in" style="animation-delay:1.45s">
      <text class="mono" x="72" y="272" font-size="14" fill="#C77B9B">$ <tspan fill="#F8F0F3">ls ./shipped</tspan></text>
      <text class="mono" x="72" y="297" font-size="13.5" fill="#701A3D">→ <tspan fill="#B6A3AC">donor-enrichment image-segmentation n8n-sync eviction-compliance</tspan></text>
    </g>
    <g class="in" style="animation-delay:1.80s">
      <text class="mono" x="72" y="322" font-size="14" fill="#C77B9B">$ <tspan fill="#F8F0F3">echo $PRINCIPLE</tspan></text>
      <text class="mono" x="72" y="347" font-size="13.5" fill="#701A3D">→ <tspan fill="#B6A3AC">difficult business problems → simple, dependable solutions</tspan></text>
    </g>
  <rect class="blink" x="72" y="360" width="8" height="2" fill="#E5B5C7"/>
    <g class="in" style="animation-delay:0.60s">
