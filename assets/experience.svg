      <rect x="570.0" y="102" width="520.0" height="30" rx="15" fill="url(#barHot)" stroke="#E5B5C7" stroke-opacity=".7"/>
      <text class="mono" x="586.0" y="121" font-size="11" letter-spacing=".5" fill="#F8F0F3">Mar 2022 – Jun 2026</text>
      <text class="mono" x="572.0" y="154" font-size="11" fill="#E5B5C7">Backend Dev → Full Stack → Senior → Lead → AI Software Engineer</text>
    </g>
    <g class="in" style="animation-delay:0.50s">
      <circle cx="52" cy="200" r="4" fill="#C77B9B"/>
      <text class="serif" x="68" y="207" font-size="23" fill="#F8F0F3">Bitsoft</text>
