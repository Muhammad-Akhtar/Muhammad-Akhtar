      <rect x="310.0" y="186" width="370.0" height="30" rx="15" fill="url(#bar)" stroke="#E5B5C7" stroke-opacity=".3"/>
      <text class="mono" x="326.0" y="205" font-size="11" letter-spacing=".5" fill="#F8F0F3">Jan 2020 – Jan 2023</text>
      
    </g>
    <g class="in" style="animation-delay:0.70s">
      <circle cx="52" cy="284" r="4" fill="#C77B9B"/>
      <text class="serif" x="68" y="291" font-size="23" fill="#F8F0F3">Graymatrix</text>
      <text class="sans" x="68" y="313" font-size="13" fill="#B6A3AC">Full Stack Developer · remote</text>
      <rect x="310.0" y="270" width="240.0" height="30" rx="15" fill="url(#bar)" stroke="#E5B5C7" stroke-opacity=".3"/>
      <text class="mono" x="326.0" y="289" font-size="11" letter-spacing=".5" fill="#F8F0F3">Jan 2020 – Dec 2021</text>
      
    </g>
  <path d="M40 362 H1160" stroke="#C77B9B" stroke-opacity=".16"/>
  <text class="mono" x="52" y="390" font-size="10.5" letter-spacing="2" fill="#B6A3AC">6+ YEARS · BACKEND → FULL STACK → LEAD → AI ENGINEERING</text>
