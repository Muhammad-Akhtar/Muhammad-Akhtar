<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d">
  <title id="t">Experience</title>
  <desc id="d">Vaival Technologies, AI Engineer, March 2022 to June 2026: grew from backend developer to full stack, senior, lead and AI software engineer. Bitsoft, Senior Software Engineer, January 2020 to January 2023. Graymatrix, Full Stack Developer (remote), January 2020 to December 2021.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/></linearGradient>
    <radialGradient id="glow" cx="85%" cy="10%" r="70%"><stop offset="0" stop-color="#701A3D" stop-opacity="0.55"/><stop offset="1" stop-color="#451126" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="420" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="20" fill="url(#glow)"/>
  <rect x=".5" y=".5" width="1199" height="419" rx="19.5" fill="none" stroke="#C77B9B" stroke-opacity=".16"/>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#451126"/><stop offset="1" stop-color="#701A3D" stop-opacity=".8"/></linearGradient>
    <linearGradient id="barHot" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#701A3D"/><stop offset="1" stop-color="#A12556"/></linearGradient>
  </defs>
  <style>
    .serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .in { animation: in 1s cubic-bezier(.16,1,.3,1) both; }
    .fade { animation: fade 1.2s ease both; }
    .draw { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: draw 1.8s cubic-bezier(.65,0,.35,1) .4s forwards; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes blink { 50% { opacity: 0; } }
    
    @media (prefers-reduced-motion: reduce) {
      .in, .fade, .blink { animation: none; }
      .draw { animation: none; stroke-dashoffset: 0; }
      .motion { display: none; }
    }
  </style>
  <text class="mono" x="52" y="72" font-size="11" letter-spacing="2.6" fill="#C77B9B">ROLE · COMPANY</text>
  <path d="M310.0 84 V350" stroke="#C77B9B" stroke-opacity=".1"/><text class="mono" x="310.0" y="72" font-size="11" letter-spacing="1.5" fill="#B6A3AC">2020</text>
  <path d="M430.0 84 V350" stroke="#C77B9B" stroke-opacity=".1"/><text class="mono" x="430.0" y="72" font-size="11" letter-spacing="1.5" fill="#B6A3AC">2021</text>
  <path d="M550.0 84 V350" stroke="#C77B9B" stroke-opacity=".1"/><text class="mono" x="550.0" y="72" font-size="11" letter-spacing="1.5" fill="#B6A3AC">2022</text>
  <path d="M670.0 84 V350" stroke="#C77B9B" stroke-opacity=".1"/><text class="mono" x="670.0" y="72" font-size="11" letter-spacing="1.5" fill="#B6A3AC">2023</text>
  <path d="M790.0 84 V350" stroke="#C77B9B" stroke-opacity=".1"/><text class="mono" x="790.0" y="72" font-size="11" letter-spacing="1.5" fill="#B6A3AC">2024</text>
  <path d="M910.0 84 V350" stroke="#C77B9B" stroke-opacity=".1"/><text class="mono" x="910.0" y="72" font-size="11" letter-spacing="1.5" fill="#B6A3AC">2025</text>
  <path d="M1030.0 84 V350" stroke="#C77B9B" stroke-opacity=".1"/><text class="mono" x="1030.0" y="72" font-size="11" letter-spacing="1.5" fill="#B6A3AC">2026</text>
    <g class="in" style="animation-delay:0.30s">
