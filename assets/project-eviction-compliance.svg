      <rect width="210" height="44" rx="12" fill="#451126"/><rect y="30" width="210" height="14" fill="#451126"/>
      <text class="mono" x="24" y="27" font-size="11" letter-spacing="2.4" fill="#E5B5C7">NOTICE</text>
      <rect x="24" y="78" width="150" height="6" rx="3" fill="#B6A3AC" opacity=".3"/><rect x="24" y="100" width="120" height="6" rx="3" fill="#B6A3AC" opacity=".3"/><rect x="24" y="122" width="140" height="6" rx="3" fill="#E5B5C7" opacity=".85"/><rect x="24" y="144" width="96" height="6" rx="3" fill="#B6A3AC" opacity=".3"/><rect x="24" y="166" width="132" height="6" rx="3" fill="#B6A3AC" opacity=".3"/><rect x="24" y="188" width="110" height="6" rx="3" fill="#B6A3AC" opacity=".3"/>
      <rect x="24" y="212" width="104" height="22" rx="11" fill="#701A3D" fill-opacity=".75"/>
      <text class="mono" x="76" y="227" font-size="10" text-anchor="middle" fill="#F8F0F3">auto-filled</text>
    </g>
    <g transform="translate(1000 150)">
      <rect width="152" height="136" rx="12" fill="#190B12" stroke="#E5B5C7" stroke-opacity=".55"/>
      <text class="mono" x="16" y="30" font-size="10" letter-spacing="2" fill="#C77B9B">COURT DATE</text>
      <rect x="16" y="48" width="14" height="12" rx="3" fill="#451126" opacity="0.8"/><rect x="36" y="48" width="14" height="12" rx="3" fill="#451126" opacity="0.8"/><rect x="56" y="48" width="14" height="12" rx="3" fill="#451126" opacity="0.8"/><rect x="76" y="48" width="14" height="12" rx="3" fill="#451126" opacity="0.8"/><rect x="96" y="48" width="14" height="12" rx="3" fill="#451126" opacity="0.8"/><rect x="116" y="48" width="14" height="12" rx="3" fill="#451126" opacity="0.8"/><rect x="16" y="66" width="14" height="12" rx="3" fill="#451126" opacity="0.8"/><rect x="36" y="66" width="14" height="12" rx="3" fill="#451126" opacity="0.8"/><rect x="56" y="66" width="14" height="12" rx="3" fill="#451126" opacity="0.8"/><rect x="76" y="66" width="14" height="12" rx="3" fill="#451126" opacity="0.8"/><rect x="96" y="66" width="14" height="12" rx="3" fill="#451126" opacity="0.8"/><rect x="116" y="66" width="14" height="12" rx="3" fill="#451126" opacity="0.8"/><rect x="16" y="84" width="14" height="12" rx="3" fill="#451126" opacity="0.8"/><rect x="36" y="84" width="14" height="12" rx="3" fill="#451126" opacity="0.8"/><rect x="56" y="84" width="14" height="12" rx="3" fill="#451126" opacity="0.8"/><rect x="76" y="84" width="14" height="12" rx="3" fill="#E5B5C7" opacity="1"/><rect x="96" y="84" width="14" height="12" rx="3" fill="#451126" opacity="0.8"/><rect x="116" y="84" width="14" height="12" rx="3" fill="#451126" opacity="0.8"/><rect x="16" y="102" width="14" height="12" rx="3" fill="#451126" opacity="0.8"/><rect x="36" y="102" width="14" height="12" rx="3" fill="#451126" opacity="0.8"/><rect x="56" y="102" width="14" height="12" rx="3" fill="#451126" opacity="0.8"/><rect x="76" y="102" width="14" height="12" rx="3" fill="#451126" opacity="0.8"/><rect x="96" y="102" width="14" height="12" rx="3" fill="#451126" opacity="0.8"/><rect x="116" y="102" width="14" height="12" rx="3" fill="#451126" opacity="0.8"/>
      <circle class="motion" cx="83" cy="90" r="11" fill="none" stroke="#E5B5C7"><animate attributeName="r" values="9;15;9" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1" dur="2.4s" repeatCount="indefinite"/></circle>
    </g>
    <g transform="translate(1000 74)">
      <rect x="0" y="0" width="152" height="30" rx="15" fill="#10070C" fill-opacity=".85" stroke="#C77B9B" stroke-opacity=".4"/>
