    <path d="M1076 104 V150" fill="none" stroke="#C77B9B" stroke-opacity=".45" stroke-dasharray="3 5"/>
    <circle class="motion" r="3.2" fill="#F8F0F3" filter="url(#soft)"><animateMotion dur="1.6s" begin="0s" repeatCount="indefinite" path="M1076 104 V150"/></circle>
