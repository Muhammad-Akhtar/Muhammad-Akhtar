      <text class="mono" x="95" y="328" font-size="11.5" text-anchor="middle" fill="#E5B5C7">FastAPI</text>
      <rect x="142" y="310" width="78" height="28" rx="14" fill="#451126" fill-opacity=".5" stroke="#C77B9B" stroke-opacity=".3"/>
      <text class="mono" x="181" y="328" font-size="11.5" text-anchor="middle" fill="#E5B5C7">Next.js</text>
      <rect x="228" y="310" width="71" height="28" rx="14" fill="#451126" fill-opacity=".5" stroke="#C77B9B" stroke-opacity=".3"/>
      <text class="mono" x="263.5" y="328" font-size="11.5" text-anchor="middle" fill="#E5B5C7">Celery</text>
      <rect x="307" y="310" width="127" height="28" rx="14" fill="#451126" fill-opacity=".5" stroke="#C77B9B" stroke-opacity=".3"/>
      <text class="mono" x="370.5" y="328" font-size="11.5" text-anchor="middle" fill="#E5B5C7">Yardi SOAP API</text>
  </g>
  <g class="fade d2">
  <g transform="translate(800 48) rotate(-4)">
