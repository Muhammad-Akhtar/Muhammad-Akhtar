<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="t d">
  <title id="t">Eviction Compliance Platform: Recommends notices, fills legal forms, tracks court dates.</title>
  <desc id="d">Eviction Compliance Platform, built as Lead Developer with FastAPI, Next.js, Celery and the Yardi SOAP API: recommends eviction notices, auto-fills legal documents and tracks court dates.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/></linearGradient>
    <radialGradient id="glow" cx="78%" cy="40%" r="55%"><stop offset="0" stop-color="#701A3D" stop-opacity="0.6"/><stop offset="1" stop-color="#451126" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="370" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="370" rx="20" fill="url(#glow)"/>
  <rect x=".5" y=".5" width="1199" height="369" rx="19.5" fill="none" stroke="#C77B9B" stroke-opacity=".16"/>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#F8F0F3" stroke-opacity=".03"/></pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .in { animation: in 1s cubic-bezier(.16,1,.3,1) both; }
    .fade { animation: fade 1.2s ease both; }
    .draw { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: draw 1.8s cubic-bezier(.65,0,.35,1) .4s forwards; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes blink { 50% { opacity: 0; } }
    .d1{animation-delay:.15s}.d2{animation-delay:.3s}.d3{animation-delay:.45s}.d4{animation-delay:.6s}
    @media (prefers-reduced-motion: reduce) {
      .in, .fade, .blink { animation: none; }
      .draw { animation: none; stroke-dashoffset: 0; }
      .motion { display: none; }
    }
  </style>
  <rect x="720" y="0" width="480" height="370" fill="url(#grid)"/>
  <g class="in"><text class="mono" x="56" y="58" font-size="11" letter-spacing="3" fill="#C77B9B">04 · LEAD DEVELOPER · FASTAPI · NEXT.JS</text></g>
  <g class="in d1"><text class="serif" x="54" y="118" font-size="46" letter-spacing="-.5" fill="#F8F0F3">Eviction Compliance Platform</text></g>
  <g class="in d2">
    <text class="sans" x="56" y="158" font-size="17" fill="#B6A3AC">Recommends notices, fills legal forms, tracks court dates.</text>
    <text class="mono" x="56" y="192" font-size="12.5" fill="#C77B9B">BUILT › <tspan fill="#F8F0F3">Yardi SOAP API integration · Celery jobs · FastAPI + Next.js</tspan></text>
  </g>
  <path class="draw" d="M56 220 H690" stroke="#C77B9B" stroke-opacity=".3"/>
  <g class="in d3">
      <text class="serif" x="56" y="270" font-size="36" fill="#F8F0F3">Notices</text>
      <text class="sans" x="57" y="293" font-size="13" fill="#B6A3AC">recommended per case</text>
      <text class="serif" x="261" y="270" font-size="36" fill="#F8F0F3">Auto-fill</text>
      <text class="sans" x="262" y="293" font-size="13" fill="#B6A3AC">legal documents</text>
      <text class="serif" x="466" y="270" font-size="36" fill="#F8F0F3">Tracked</text>
      <text class="sans" x="467" y="293" font-size="13" fill="#B6A3AC">court dates</text>
  </g>
  <g class="in d4">
